name: 🐛 Bug 报告
description: 签到、采集或看板出了问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请确认：

        - 客户端**界面没有改版**（各家应用更新后选择器可能失效，属于已知限制）；
        - 用的不是修改过 `config.json` 以外文件的安装目录。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 期望的行为 vs 实际的行为；如果涉及看板显示，请描述哪个应用的哪一行。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: |
        粘贴 `logs/runner.log`、`logs/collect.log` 或 `logs/board-server.log` 的相关片段。
        注意先删掉账号名、手机号等个人信息。
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: Windows 版本 / Node.js 版本 / DSH 版本
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: 涉及哪个应用？
      options:
        - WorkBuddy
        - 豆包
        - CodeArts
        - AutoClaw
        - 看板 / 插件本身
        - 安装 / 计划任务
    validations:
      required: true
