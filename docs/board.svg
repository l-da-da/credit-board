  <!-- CodeArts card -->
  <rect x="20" y="208" width="320" height="52" rx="10" fill="#2a2b31" stroke="#3b3c44"/>
  <text x="32" y="228" font-size="13" font-weight="600" fill="#e8e9ec">CodeArts</text>
  <text x="328" y="230" font-size="16" font-weight="700" fill="#e8e9ec" text-anchor="end">5600.00 积分</text>
  <rect x="32" y="236" width="52" height="16" rx="8" fill="#1d4d38"/>
  <text x="58" y="248" font-size="10.5" fill="#7fe0ae" text-anchor="middle">今日已签</text>
  <text x="92" y="248" font-size="11" fill="#9aa0a8">已用 0.00</text>

  <!-- AutoClaw card -->
  <rect x="20" y="266" width="320" height="52" rx="10" fill="#2a2b31" stroke="#3b3c44"/>
